apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-lb-config
  namespace: laborator-lb
data:
  default.conf: |
    upstream api_upstream {
        # ClusterIP-ul backend-ului — traficul este distribuit de kube-proxy între cele 3 pod-uri.
        server lb-api-backend.laborator-lb.svc.cluster.local:8000;
    }

    server {
        listen 8080;

        location / {
            # --- IMPORTANT (demo Round Robin între pod-uri) ---
            # kube-proxy (mod iptables/IPVS) alege backend-ul pentru fiecare *conexiune TCP nouă*
            # spre ClusterIP-ul Service-ului, nu pentru fiecare cerere HTTP pe aceeași conexiune.
            # Dacă NGINX ține Keep-Alive deschis către upstream (implicit cu HTTP/1.1 și
            #   proxy_set_header Connection "";
            # întregul flux rămâne pe același pod și veți vedea același hostname la fiecare curl.
            #
            # Variante echivalente aici: HTTP/1.0 și închiderea conexiunii (mai jos), sau `keepalive_timeout 0`,
            # plus dezactivarea keep-alive către upstream. În acest manifest folosim explicit:
            proxy_http_version 1.0;
            proxy_set_header Connection "Close";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://api_upstream;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lb-deployment
  namespace: laborator-lb
  labels:
    app: nginx-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-lb
  template:
    metadata:
      labels:
        app: nginx-lb
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-lb-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb-service
  namespace: laborator-lb
spec:
  type: NodePort
  selector:
    app: nginx-lb
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30808
