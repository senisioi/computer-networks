# PersistentVolumeClaim — rezervă spațiu de stocare stabil pentru PostgreSQL.
# Dacă pod-ul este repornit sau rescheduat pe alt nod, datele supraviețuiesc.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: laborator
spec:
  accessModes:
    - ReadWriteOnce   # Un singur nod poate monta volumul în scriere (suficient pentru o singură replică)
  resources:
    requests:
      storage: 1Gi    # KinD provizionează automat un PV local pe nod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: laborator
  labels:
    app: postgres
spec:
  replicas: 1   # Bazele de date relaționale simple nu se scalează orizontal fără soluții speciale
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine     # Imagine oficială; KinD o descarcă automat
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "notesdb"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data  # Directorul de date PostgreSQL → montat pe PVC
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "notes_user", "-d", "notesdb"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: laborator
spec:
  type: ClusterIP    # Baza de date nu este expusă niciodată în exterior
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
