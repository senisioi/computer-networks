apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: laborator
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # --- Init Container ---
      # Rulează ÎNAINTE de containerul principal și trebuie să se termine cu succes.
      # Acest pattern garantează că API-ul nu pornește niciodată înainte ca PostgreSQL
      # să fie gata să accepte conexiuni — elimină erorile de tip "connection refused" la start.
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Aștept PostgreSQL pe postgres-service:5432..."
            until nc -z postgres-service 5432; do
              echo "PostgreSQL nu este gata. Reîncerc în 3 secunde..."
              sleep 3
            done
            echo "PostgreSQL este disponibil! Pornesc API-ul."

      containers:
      - name: api
        image: notes-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef:
            name: app-config     # Injectează DB_HOST, DB_PORT, DB_NAME, DB_USER
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"          # HPA va scala când utilizarea medie depășește 50% din acest limit
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: laborator
spec:
  type: ClusterIP    # API-ul intern — accesat doar de frontend, nu direct din browser
  selector:
    app: api
  ports:
    - port: 5001
      targetPort: 5001
